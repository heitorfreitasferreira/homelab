apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: securo-backup
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "31"
spec:
  project: default
  source:
    repoURL: https://github.com/heitorfreitasferreira/homelab.git
    targetRevision: main
    path: apps/securo-backup
  destination:
    server: https://kubernetes.default.svc
    namespace: securo
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}