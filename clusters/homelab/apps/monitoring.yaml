apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-blackbox
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "16"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-blackbox-exporter
    targetRevision: 11.21.3
    helm:
      valuesObject:
        fullnameOverride: blackbox
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 64Mi}
        config:
          modules:
            http_2xx:
              prober: http
              timeout: 10s
              http:
                preferred_ip_protocol: ip4
                follow_redirects: true
            dns_github:
              prober: dns
              timeout: 5s
              dns:
                query_name: github.com
                query_type: A
                transport_protocol: udp
                preferred_ip_protocol: ip4
                valid_rcodes: [NOERROR]
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "17"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: 10.5.15
    helm:
      valuesObject:
        fullnameOverride: grafana
        resources:
          requests: {cpu: 20m, memory: 96Mi}
          limits: {memory: 256Mi}
        persistence:
          enabled: true
          size: 1Gi
        grafana.ini:
          server:
            root_url: https://grafana.tail76c1c6.ts.net
          analytics:
            reporting_enabled: false
            check_for_updates: false
          users:
            default_language: pt-BR
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: VictoriaMetrics
                uid: victoriametrics
                type: prometheus
                url: http://vmsingle:8428
                access: proxy
                isDefault: true
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: default
                orgId: 1
                folder: ""
                type: file
                disableDeletion: true
                options:
                  path: /var/lib/grafana/dashboards/default
        dashboards:
          default:
            node-exporter-full:
              gnetId: 1860
              revision: 41
              datasource: VictoriaMetrics
            k8s-global:
              gnetId: 15757
              revision: 43
              datasource: VictoriaMetrics
            k8s-pods:
              gnetId: 15760
              revision: 36
              datasource: VictoriaMetrics
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
