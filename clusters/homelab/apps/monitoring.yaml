    chart: kube-state-metrics
    targetRevision: 9.0.1
    helm:
      valuesObject:
        fullnameOverride: kube-state-metrics
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 128Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-blackbox
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "16"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-blackbox-exporter
    targetRevision: 11.21.3
    helm:
      valuesObject:
        fullnameOverride: blackbox
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 64Mi}
        config:
          modules:
            http_2xx:
              prober: http
              timeout: 10s
              http:
                preferred_ip_protocol: ip4
                follow_redirects: true
            dns_github:
              prober: dns
              timeout: 5s
              dns:
                query_name: github.com
                query_type: A
                transport_protocol: udp
                preferred_ip_protocol: ip4
                valid_rcodes: [NOERROR]
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "17"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: 10.5.15
    helm:
      valuesObject:
        fullnameOverride: grafana
        # GF_OIDC_CLIENT_ID e GF_OIDC_CLIENT_SECRET vem do SOPS (apps/monitoring).
        envFromSecret: grafana-oidc
        # O init roda como root com apenas CAP_CHOWN. Como /var/lib/grafana/csv,
        # pdf e png ficam 0700 do uid 472, root sem DAC_OVERRIDE nao consegue
        # atravessar os diretorios e o chown -R falha (ExitCode 1, CrashLoopBackOff).
        initChownData:
          securityContext:
            capabilities:
              add: [CHOWN, DAC_OVERRIDE]
              drop: [ALL]
        resources:
          requests: {cpu: 20m, memory: 96Mi}
          limits: {memory: 256Mi}
        # Os paineis proprios do repo chegam por ConfigMap com a etiqueta
        # grafana_dashboard=1. O sidecar copia para /tmp/dashboards e o provider carrega.
        sidecar:
          resources:
            requests: {cpu: 5m, memory: 32Mi}
            limits: {memory: 128Mi}
          dashboards:
            enabled: true
            searchNamespace: monitoring
            label: grafana_dashboard
            labelValue: "1"
            resource: configmap
            # O provider varre /tmp/dashboards a cada 30 s. Sem reload nao depende
            # da senha do admin, que pode ter sido trocada fora do Secret.
            skipReload: true
            provider:
              folder: Homelab
        persistence:
          enabled: true
          size: 1Gi
        admin:
          existingSecret: grafana-admin
        grafana.ini:
          server:
            root_url: https://grafana.tail76c1c6.ts.net
            enable_gzip: true
          analytics:
            reporting_enabled: false
            check_for_updates: false
          users:
            default_language: pt-BR
          auth.generic_oauth:
            enabled: true
            name: Pocket ID
            scopes: openid profile email groups
            auth_url: https://auth.htrlab.duckdns.org/authorize
            token_url: https://auth.htrlab.duckdns.org/api/oidc/token
            api_url: https://auth.htrlab.duckdns.org/api/oidc/userinfo
            client_id: $__env{GF_OIDC_CLIENT_ID}
            client_secret: $__env{GF_OIDC_CLIENT_SECRET}
            use_pkce: true
            allow_sign_up: true
            auto_login: false
            skip_org_role_sync: true
            email_attribute_name: email:primary
            # Quem tem conta no Pocket ID e da casa. O login por senha do admin continua.
            auto_assign_org_role: Admin
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: VictoriaMetrics
                uid: victoriametrics
                type: prometheus
                url: http://vmsingle:8428
                access: proxy
                isDefault: true
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: default
                orgId: 1
                folder: ""
                type: file
                disableDeletion: true
                options:
                  path: /var/lib/grafana/dashboards/default
        dashboards:
          default:
            node-exporter-full:
              gnetId: 1860
              revision: 41
              datasource: VictoriaMetrics
            k8s-global:
              gnetId: 15757
              revision: 43
              datasource: VictoriaMetrics
            k8s-pods:
              gnetId: 15760
              revision: 36
              datasource: VictoriaMetrics
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
