# Observabilidade, etapas 1 e 2: metricas, alertas e a central de hardware (DECISIONS.md, itens 20 e 27).
# VictoriaMetrics coleta, vmalert avalia as regras, o Alertmanager manda para o Telegram e
# pinga o Healthchecks.io (dead man's switch: se a VPS cair, o Healthchecks avisa).
# apps/monitoring: namespace, ingresses da tailnet e o Secret do Alertmanager (SOPS).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  project: default
  source:
    repoURL: https://github.com/heitorfreitasferreira/homelab.git
    targetRevision: main
    path: apps/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    retry:
      limit: 10
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-vmsingle
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "16"
spec:
  project: default
  source:
    repoURL: https://victoriametrics.github.io/helm-charts/
    chart: victoria-metrics-single
    targetRevision: 0.51.0
    helm:
      valuesObject:
        server:
          fullnameOverride: vmsingle
          retentionPeriod: 90d
          persistentVolume:
            enabled: true
            size: 10Gi
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {memory: 512Mi}
          extraArgs:
            # Caches com 40% do limite do pod. Com allowedBytes=256MiB e limite de 384Mi,
            # sobrava pouco para o resto do processo e o pod morria por OOM na subida.
            memory.allowedPercent: "40"
            # O scrape.yml vem de ConfigMap montado. Sem isso o vmsingle so le na subida
            # e continua raspando alvos que ja sairam do repo ate o pod reiniciar.
            promscrape.configCheckInterval: 1m
          scrape:
            enabled: true
            config:
              global:
                scrape_interval: 30s
              scrape_configs:
                - job_name: victoriametrics
                  static_configs:
                    - targets: [localhost:8428]
                - job_name: kubernetes-nodes
                  scheme: https
                  tls_config:
                    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                    insecure_skip_verify: true
                  bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                  kubernetes_sd_configs: [{role: node}]
                  relabel_configs:
                    - action: labelmap
                      regex: __meta_kubernetes_node_label_(.+)
                  # No k3s o /metrics do kubelet traz tambem apiserver, scheduler e controller:
                  # 84 mil series, que derrubavam o vmsingle por OOM. Fica so o uso dos volumes.
                  metric_relabel_configs:
                    - action: keep
                      source_labels: [__name__]
                      regex: kubelet_volume_stats_.+|kubelet_running_pods|kubelet_running_containers
                - job_name: kubernetes-nodes-cadvisor
                  scheme: https
                  tls_config:
                    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                    insecure_skip_verify: true
                  bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                  kubernetes_sd_configs: [{role: node}]
                  metrics_path: /metrics/cadvisor
                  honor_timestamps: false
                  relabel_configs:
                    - action: labelmap
                      regex: __meta_kubernetes_node_label_(.+)
                # node-exporter, kube-state-metrics e afins: Service com prometheus.io/scrape.
                - job_name: kubernetes-service-endpoints
                  # Preserva o label node que o proprio exporter publica (KSM).
                  # Sem isso, o node do pod sobrescreve o node real e o WSL vira
                  # uma segunda serie com node=racknerd.
                  honor_labels: true
                  kubernetes_sd_configs: [{role: endpoints}]
                  relabel_configs:
                    - action: drop
                      source_labels: [__meta_kubernetes_pod_container_init]
                      regex: true
                    - action: keep
                      source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
                      regex: true
                    - action: replace
                      source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
                      target_label: __metrics_path__
                      regex: (.+)
                    - action: replace
                      source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
                      target_label: __address__
                      regex: ([^:]+)(?::\d+)?;(\d+)
                      replacement: $1:$2
                    - action: replace
                      source_labels: [__meta_kubernetes_namespace]
                      target_label: namespace
                    - action: replace
                      source_labels: [__meta_kubernetes_service_name]
                      target_label: service
                    - action: replace
                      source_labels: [__meta_kubernetes_pod_node_name]
                      target_label: node
                # O casa pela tailnet (node-exporter do Debian, papel Ansible casa).
                - job_name: casa
                  static_configs:
                    - targets: [100.112.62.47:9100]
                      # instance=casa mantem as expressoes antigas, node=casa
                      # deixa os paineis e legendas iguais aos nos do k3s.
                      labels: {instance: casa, node: casa}
                - job_name: vmalert
                  static_configs:
                    - targets: [vmalert:8880]
                - job_name: alertmanager
                  static_configs:
                    - targets: [alertmanager:9093]
                # Sondas HTTPS: o que o usuario usa, de fora para dentro.
                - job_name: probe-https
                  metrics_path: /probe
                  params: {module: [http_2xx]}
                  static_configs:
                    - targets:
                        - https://casa.tail76c1c6.ts.net
                        - https://home.tail76c1c6.ts.net
                        - https://argocd.tail76c1c6.ts.net
                        - https://grafana.tail76c1c6.ts.net
                        - https://pihole.tail76c1c6.ts.net/admin/
                        - https://nuvem.htrlab.duckdns.org
                        - https://auth.htrlab.duckdns.org
                        - https://audio.htrlab.duckdns.org
                  relabel_configs:
                    - source_labels: [__address__]
                      target_label: __param_target
                    - source_labels: [__param_target]
                      target_label: instance
                    - target_label: __address__
                      replacement: blackbox:9115
                # DNS da tailnet: o Pi-hole do racknerd responde?
                - job_name: probe-dns
                  metrics_path: /probe
                  params: {module: [dns_github]}
                  static_configs:
                    - targets: [100.104.129.86:53]
                  relabel_configs:
                    - source_labels: [__address__]
                      target_label: __param_target
                    - source_labels: [__param_target]
                      target_label: instance
                    - target_label: __address__
                      replacement: blackbox:9115
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-vmalert
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "16"
spec:
  project: default
  source:
    repoURL: https://victoriametrics.github.io/helm-charts/
    chart: victoria-metrics-alert
    targetRevision: 0.53.0
    helm:
      valuesObject:
        server:
          fullnameOverride: vmalert
          datasource:
            url: http://vmsingle:8428
          remoteWrite:
            url: http://vmsingle:8428
          remoteRead:
            url: http://vmsingle:8428
          notifier:
            alertmanager:
              url: http://alertmanager:9093
          extraArgs:
            external.url: https://grafana.tail76c1c6.ts.net
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 96Mi}
          config:
            alerts:
              groups:
                - name: watchdog
                  rules:
                    # Sempre disparado. O Alertmanager pinga o Healthchecks.io com ele.
                    - alert: Watchdog
                      expr: vector(1)
                      labels: {severity: none}
                      annotations:
                        summary: Pipeline de alertas vivo
                - name: hosts
                  rules:
                    - alert: AlvoFora
                      expr: up{instance!~"100\\.89\\.110\\.97:.*|pc-heito-wsl",node!="pc-heito-wsl",kubernetes_io_hostname!="pc-heito-wsl"} == 0
                      for: 3m
                      labels: {severity: critical}
                      annotations:
                        summary: "{{ $labels.job }} ({{ $labels.instance }}) sem resposta ha 3 min"
                    - alert: MemoriaBaixa
                      expr: node_memory_MemAvailable_bytes{node!="pc-heito-wsl"} / node_memory_MemTotal_bytes{node!="pc-heito-wsl"} < 0.10
                      for: 10m
                      labels: {severity: warning}
                      annotations:
                        summary: "{{ $labels.instance }}: {{ $value | humanizePercentage }} de RAM livre"
                    - alert: DiscoQuaseCheio
                      # Piso de 1 GB e /usr/src fora: no WSL o /dev/sdb (0,1 GiB, read-only, headers do
                      # kernel) fica sempre cheio e disparava o alerta para sempre.
                      expr: node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs",mountpoint!~"/usr/src.*",node!="pc-heito-wsl"} / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs",mountpoint!~"/usr/src.*",node!="pc-heito-wsl"} < 0.10 and on(instance, device, mountpoint) node_filesystem_size_bytes{node!="pc-heito-wsl"} > 1e9
                      for: 15m
                      labels: {severity: warning}
                      annotations:
                        summary: "{{ $labels.instance }} {{ $labels.mountpoint }}: {{ $value | humanizePercentage }} livre"
                    - alert: TemperaturaAlta
                      expr: max by (instance) (node_hwmon_temp_celsius{node!="pc-heito-wsl"}) > 85
                      for: 10m
                      labels: {severity: warning}
                      annotations:
                        summary: "{{ $labels.instance }} a {{ $value }} C"
                    - alert: InterfaceDoCaboFora
                      expr: node_network_up{instance="casa", device="enp2s0f5"} == 0 or absent(node_network_up{instance="casa", device="enp2s0f5"})
                      for: 5m
                      labels: {severity: critical}
                      annotations:
                        summary: "casa sem a placa enp2s0f5 (o cabo caiu ou a placa mudou de nome)"
                - name: kubernetes
                  rules:
                    - alert: PodReiniciando
                      expr: increase(kube_pod_container_status_restarts_total[30m]) * on (namespace, pod) group_left(node) kube_pod_info{node!="pc-heito-wsl"} > 3
                      labels: {severity: warning}
                      annotations:
                        summary: "{{ $labels.namespace }}/{{ $labels.pod }} reiniciou {{ $value | printf \"%.0f\" }} vezes em 30 min"
                    - alert: VolumeQuaseCheio
                      expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.10
                      for: 15m
                      labels: {severity: warning}
                      annotations:
                        summary: "{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }}: {{ $value | humanizePercentage }} livre"
                    - alert: PodNaoPronto
                      expr: sum by (namespace, pod) (kube_pod_status_ready{condition="false"} * on (namespace, pod) group_left(node) kube_pod_info{node!="pc-heito-wsl"} * on (namespace, pod) group_left() kube_pod_status_phase{phase="Running"}) > 0
                      for: 10m
                      labels: {severity: warning}
                      annotations:
                        summary: "{{ $labels.namespace }}/{{ $labels.pod }} rodando sem ficar pronto ha 10 min"
                    - alert: NodeNaoPronto
                      expr: kube_node_status_condition{condition="Ready",status="true",node!="pc-heito-wsl"} == 0
                      for: 5m
                      labels: {severity: critical}
                      annotations:
                        summary: "no {{ $labels.node }} nao esta Ready"
                    - alert: NodeSobPressao
                      expr: kube_node_status_condition{condition=~"MemoryPressure|DiskPressure|PIDPressure",status="true",node!="pc-heito-wsl"} == 1
                      for: 5m
                      labels: {severity: warning}
                      annotations:
                        summary: "no {{ $labels.node }} com {{ $labels.condition }}"
                    - alert: PodOomKilled
                      expr: increase(kube_pod_container_status_terminated_reason{reason="OOMKilled"}[15m]) * on (namespace, pod) group_left(node) kube_pod_info{node!="pc-heito-wsl"} > 0
                      labels: {severity: warning}
                      annotations:
                        summary: "{{ $labels.namespace }}/{{ $labels.pod }}: container {{ $labels.container }} morreu por OOM"
                    - alert: DeploymentSemReplicas
                      expr: kube_deployment_spec_replicas{namespace!~"kube-system"} > kube_deployment_status_replicas_available{namespace!~"kube-system"}
                      for: 15m
                      labels: {severity: warning}
                      annotations:
                        summary: "{{ $labels.namespace }}/{{ $labels.deployment }}: replicas disponiveis abaixo do desejado"
                - name: sondas
                  rules:
                    - alert: SiteFora
                      expr: probe_success{job="probe-https"} == 0
                      for: 3m
                      labels: {severity: critical}
                      annotations:
                        summary: "{{ $labels.instance }} fora do ar"
                    - alert: DNSDaTailnetFora
                      expr: probe_success{job="probe-dns"} == 0
                      for: 2m
                      labels: {severity: critical}
                      annotations:
                        summary: "Pi-hole do racknerd nao responde: a tailnet esta sem DNS"
                    - alert: SiteLento
                      expr: avg_over_time(probe_duration_seconds{job="probe-https"}[5m]) > 5 and probe_success{job="probe-https"} == 1
                      for: 10m
                      labels: {severity: warning}
                      annotations:
                        summary: "{{ $labels.instance }}: resposta em {{ $value | printf \"%.1f\" }} s"
                    - alert: CertificadoVencendo
                      expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 10
                      for: 1h
                      labels: {severity: warning}
                      annotations:
                        summary: "{{ $labels.instance }}: certificado vence em {{ $value | printf \"%.0f\" }} dias"
                - name: casa
                  rules:
                    - alert: CasaNaBateria
                      expr: node_power_supply_online{instance="casa",power_supply="AC0"} == 0
                      for: 1m
                      labels: {severity: critical}
                      annotations:
                        summary: "casa esta na bateria: a tomada caiu e o notebook desliga em minutos"
                    - alert: CasaCpuAlta
                      expr: 100 * (1 - avg(rate(node_cpu_seconds_total{instance="casa",mode="idle"}[5m]))) > 90
                      for: 15m
                      labels: {severity: warning}
                      annotations:
                        summary: "casa: CPU em {{ $value | printf \"%.0f\" }}% por 15 min"
                    - alert: CasaSwapQuaseCheia
                      expr: (node_memory_SwapTotal_bytes{instance="casa"} - node_memory_SwapFree_bytes{instance="casa"}) / node_memory_SwapTotal_bytes{instance="casa"} > 0.8
                      for: 15m
                      labels: {severity: warning}
                      annotations:
                        summary: "casa: swap/zram em {{ $value | humanizePercentage }}"
                    - alert: CasaOOM
                      expr: increase(node_vmstat_oom_kill{instance="casa"}[10m]) > 0
                      labels: {severity: critical}
                      annotations:
                        summary: "casa matou processo por falta de memoria (OOM) nos ultimos 10 min"
                    - alert: CasaDiscoSomenteLeitura
                      expr: node_filesystem_readonly{instance="casa",fstype=~"ext4|xfs|btrfs"} == 1
                      for: 5m
                      labels: {severity: critical}
                      annotations:
                        summary: "casa: {{ $labels.mountpoint }} esta somente leitura"
                    - alert: CasaInodesQuaseCheios
                      expr: node_filesystem_files_free{instance="casa",fstype=~"ext4|xfs"} / node_filesystem_files{instance="casa",fstype=~"ext4|xfs"} < 0.10
                      for: 15m
                      labels: {severity: warning}
                      annotations:
                        summary: "casa: {{ $labels.mountpoint }} com {{ $value | humanizePercentage }} de inodes livres"
                    - alert: CasaDiscoLento
                      expr: rate(node_disk_io_time_seconds_total{instance="casa",device="sda"}[5m]) > 0.8
                      for: 15m
                      labels: {severity: warning}
                      annotations:
                        summary: "casa: disco ocupado mais de 80% do tempo"
                    - alert: CasaDiscoSmartFalha
                      expr: smartmon_device_smart_healthy{instance="casa"} == 0
                      for: 5m
                      labels: {severity: critical}
                      annotations:
                        summary: "casa: SMART do {{ $labels.disk }} reprovou a saude do disco"
                    - alert: CasaDiscoSetorPendente
                      expr: smartmon_current_pending_sector_raw_value{instance="casa"} > 0
                      for: 5m
                      labels: {severity: warning}
                      annotations:
                        summary: "casa: {{ $labels.disk }} tem setores pendentes de realocacao"
                    - alert: CasaDiscoRealocado
                      expr: delta(smartmon_reallocated_sector_ct_raw_value{instance="casa"}[24h]) > 0
                      for: 15m
                      labels: {severity: warning}
                      annotations:
                        summary: "casa: {{ $labels.disk }} realocou setores nas ultimas 24 h"
                    - alert: CasaDiscoCrc
                      expr: delta(smartmon_udma_crc_error_count_raw_value{instance="casa"}[24h]) > 0
                      for: 15m
                      labels: {severity: warning}
                      annotations:
                        summary: "casa: {{ $labels.disk }} teve erro de CRC nas ultimas 24 h (cabo ou controladora)"
                    - alert: CasaDiscoQuente
                      expr: max(smartmon_temperature_celsius_raw_value{instance="casa"}) > 50
                      for: 15m
                      labels: {severity: warning}
                      annotations:
                        summary: "casa: disco a {{ $value | printf \"%.0f\" }} C"
                    - alert: CasaServicoFora
                      expr: node_systemd_unit_state{instance="casa",name=~"homeassistant.service|matterhub.service|tailscaled.service|prometheus-node-exporter.service|nftables.service|ssh.service|smartmontools.service|thermald.service",state="active"} == 0
                      for: 10m
                      labels: {severity: warning}
                      annotations:
                        summary: "casa: {{ $labels.name }} nao esta ativo"
                    - alert: CasaWatchdogAusente
                      expr: absent(node_watchdog_timeleft_seconds{instance="casa"}) == 1 and on() up{job="casa"} == 1
                      for: 1h
                      labels: {severity: warning}
                      annotations:
                        summary: "casa: watchdog de hardware sumiu do node-exporter"
                    - alert: CasaRelogioFora
                      expr: abs(node_timex_offset_seconds{instance="casa"}) > 1
                      for: 10m
                      labels: {severity: warning}
                      annotations:
                        summary: "casa: relogio {{ $value | printf \"%.1f\" }} s fora do NTP"
                    - alert: CasaSemSyncNtp
                      expr: node_timex_sync_status{instance="casa"} == 0
                      for: 15m
                      labels: {severity: warning}
                      annotations:
                        summary: "casa: systemd-timesyncd nao sincronizou o relogio"
                    - alert: CasaRebootPendente
                      expr: node_reboot_required{instance="casa"} == 1
                      for: 24h
                      labels: {severity: warning}
                      annotations:
                        summary: "casa: atualizacao pediu reboot ha mais de 24 h"
                - name: tailscale
                  rules:
                    - alert: TailscaleColetorFalhou
                      expr: tailscale_exporter_success{instance="casa"} == 0
                      for: 30m
                      labels: {severity: warning}
                      annotations:
                        summary: "casa: o coletor de metricas do Tailscale falhou"
                    - alert: TailscaleMetricasParadas
                      expr: time() - node_textfile_mtime_seconds{instance="casa",file="/var/lib/prometheus/node-exporter/tailscale.prom"} > 300
                      for: 5m
                      labels: {severity: warning}
                      annotations:
                        summary: "casa: metricas do Tailscale paradas ha mais de 5 min"
                    - alert: TailscaleMetricasSumiram
                      expr: absent(tailscale_up{instance="casa"}) == 1 and on() up{job="casa"} == 1
                      for: 30m
                      labels: {severity: warning}
                      annotations:
                        summary: "casa: metricas do Tailscale sumiram do node-exporter"
                    - alert: TailscaleRacknerdFora
                      expr: tailscale_peer_online{instance="casa",peer="racknerd"} == 0
                      for: 10m
                      labels: {severity: warning}
                      annotations:
                        summary: "Tailscale do racknerd offline para o casa"
                    - alert: TailscaleRacknerdHostFora
                      expr: tailscale_up{service="node-exporter"} == 0
                      for: 5m
                      labels: {severity: warning}
                      annotations:
                        summary: "tailscaled do racknerd nao responde"
                    - alert: TailscaleChaveVencendo
                      expr: (tailscale_peer_key_expiry_timestamp_seconds{instance="casa"} - time()) / 86400 < 14
                      for: 1h
                      labels: {severity: warning}
                      annotations:
                        summary: "{{ $labels.peer }}: chave do Tailscale vence em {{ $value | printf \"%.0f\" }} dias"
                    - alert: TailscaleCasaEmRelay
                      expr: tailscale_peer_direct{instance="casa",peer="racknerd"} == 0 and tailscale_peer_online{instance="casa",peer="racknerd"} == 1
                      for: 2h
                      labels: {severity: info}
                      annotations:
                        summary: "casa fala com o racknerd via DERP ha 2 h"
                - name: pipeline
                  rules:
                    - alert: NotificacaoFalhou
                      expr: sum by (integration) (increase(alertmanager_notifications_failed_total[15m])) > 0
                      for: 5m
                      labels: {severity: warning}
                      annotations:
                        summary: "Alertmanager: {{ $value | printf \"%.0f\" }} falhas em {{ $labels.integration }}"
        alertmanager:
          enabled: true
          fullnameOverride: alertmanager
          retention: 120h
          configSecret: alertmanager-config
          persistentVolume:
            enabled: true
            size: 1Gi
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 96Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-node-exporter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "16"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-node-exporter
    targetRevision: 5.1.0
    helm:
      valuesObject:
        fullnameOverride: node-exporter
        resources:
          requests: {cpu: 10m, memory: 24Mi}
          limits: {memory: 64Mi}
        # O tailscale-prometheus.timer escreve no host; o coletor le o arquivo.
        # Os dois primeiros args repetem o default do chart (arrays no Helm substituem).
        extraArgs:
          - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
          - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
          - --collector.textfile.directory=/var/lib/prometheus/node-exporter
        extraHostVolumeMounts:
          - name: textfile
            hostPath: /var/lib/prometheus/node-exporter
            mountPath: /var/lib/prometheus/node-exporter
            readOnly: true
            type: DirectoryOrCreate
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-kube-state-metrics
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "16"
spec:
  project: default
  source:
