# Automacao de audiobooks: Prowlarr (indexadores) -> ReadMeABook -> Transmission.
# Fica no namespace audiobookshelf para o ReadMeABook escrever direto na biblioteca.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: audio-auto
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "26"
spec:
  project: default
  source:
    repoURL: https://github.com/heitorfreitasferreira/homelab.git
    targetRevision: main
    path: apps/audio-auto
  destination:
    server: https://kubernetes.default.svc
    namespace: audiobookshelf
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    retry:
      limit: 10
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}
