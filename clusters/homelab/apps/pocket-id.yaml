# OIDC com passkey (DECISIONS.md, item 35). Serve de login para os apps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pocket-id
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  # Para o prune do root apagar namespace, PVC e Ingress junto com a Application.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/heitorfreitasferreira/homelab.git
    targetRevision: main
    path: apps/pocket-id
  destination:
    server: https://kubernetes.default.svc
    namespace: pocket-id
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    retry:
      limit: 10
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}
