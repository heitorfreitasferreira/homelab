apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ente
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://github.com/heitorfreitasferreira/homelab.git
    targetRevision: main
    path: apps/ente
  destination:
    server: https://kubernetes.default.svc
    namespace: ente
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    retry:
      limit: 10
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}
