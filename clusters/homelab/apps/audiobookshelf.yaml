# Audiobookshelf em audio.htrlab.duckdns.org, biblioteca em local-path.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: audiobookshelf
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  project: default
  source:
    repoURL: https://github.com/heitorfreitasferreira/homelab.git
    targetRevision: main
    path: apps/audiobookshelf
  destination:
    server: https://kubernetes.default.svc
    namespace: audiobookshelf
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    retry:
      limit: 10
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}
