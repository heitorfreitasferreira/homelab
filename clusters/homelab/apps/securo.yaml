# Securo (teste): app de financas pessoais, chart oficial do repo.
# Postgres, Redis e anexos rodam em disco (local-path), sem S3.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: securo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  project: default
  source:
    repoURL: https://github.com/securo-finance/securo.git
    targetRevision: v0.20.0
    path: charts/securo
    helm:
      releaseName: securo
      values: |
        global:
          domain: securo.htrlab.duckdns.org
          tls: true

        ingress:
          enabled: true
          className: traefik
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt
          tls:
            - secretName: securo-tls
              hosts:
                - securo.htrlab.duckdns.org

        backend:
          image:
            repository: ghcr.io/securo-finance/securo-backend
            tag: "0.20.0"
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}

        frontend:
          image:
            repository: ghcr.io/securo-finance/securo-frontend
            tag: "0.20.0"
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}

        celeryWorker:
          enabled: true
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {memory: 384Mi}

        celeryBeat:
          enabled: false

        postgresql:
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 384Mi}

        redis:
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}

        persistence:
          attachments:
            size: 1Gi
          agentKnowledge:
            enabled: false
          agentEmbeddingModels:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: securo
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}