# Home Assistant publicado em https://casa.htrlab.duckdns.org pelo Traefik da VPS.
# Nao abre porta na casa: o Traefik sai pela tailnet ate o IP do `casa` (DECISIONS.md).
# O IP tailnet do `casa` e estavel, o mesmo que o monitoring usa em 100.112.62.47:9100.
apiVersion: v1
kind: Service
metadata:
  name: casa-ha
spec:
  ports:
    - name: http
      port: 8123
      targetPort: 8123
---
apiVersion: v1
kind: Endpoints
metadata:
  name: casa-ha
subsets:
  - addresses:
      - ip: 100.112.62.47
    ports:
      - name: http
        port: 8123
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: casa
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  rules:
    - host: casa.htrlab.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: casa-ha
                port:
                  number: 8123
  tls:
    - hosts:
        - casa.htrlab.duckdns.org
      secretName: casa-htrlab-tls
