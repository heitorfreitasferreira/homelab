# Home Assistant publicado em https://casa.htrlab.duckdns.org pelo Traefik da VPS.
# Nao abre porta na casa. O Traefik fala com o pod socat, que sai pela tailnet ate o IP do `casa`.
# O Argo exclui Endpoints e EndpointSlice, por isso o encaminhamento e um pod, nao um Service sem seletor.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: casa-ha-proxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: casa-ha-proxy
  template:
    metadata:
      labels:
        app: casa-ha-proxy
    spec:
      containers:
        - name: socat
          image: alpine/socat@sha256:71131702f671a88b3808a70b7330f9679cd9b9933adcafadc191508edfe55bba
          args:
            - TCP-LISTEN:8123,fork,reuseaddr
            - TCP:100.112.62.47:8123
          ports:
            - name: http
              containerPort: 8123
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 32Mi}
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: casa-ha
spec:
  selector:
    app: casa-ha-proxy
  ports:
    - name: http
      port: 8123
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: casa
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: platform-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: casa.htrlab.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: casa-ha
                port:
                  number: 8123
  tls:
    - hosts:
        - casa.htrlab.duckdns.org
      secretName: casa-htrlab-tls
