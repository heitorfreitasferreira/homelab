# Admin UIs reachable only from the tailnet.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd
  namespace: argocd
  annotations:
    tailscale.com/proxy-group: ingress
spec:
  ingressClassName: tailscale
  defaultBackend:
    service: {name: argocd-server, port: {number: 80}}
  tls:
    - hosts: [argocd]
---
apiVersion: v1
kind: Service
metadata:
  name: pihole-web
  namespace: pihole
spec:
  selector: {app: pihole}
  ports: [{port: 80, targetPort: 8053}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pihole
  namespace: pihole
  annotations:
    tailscale.com/proxy-group: ingress
spec:
  ingressClassName: tailscale
  defaultBackend:
    service: {name: pihole-web, port: {number: 80}}
  tls:
    - hosts: [pihole]
---
# Permite que os Ingress destes namespaces usem o ProxyGroup compartilhado.
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroupPolicy
metadata:
  name: tailscale-ingress
  namespace: argocd
spec:
  ingress:
    - ingress
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroupPolicy
metadata:
  name: tailscale-ingress
  namespace: pihole
spec:
  ingress:
    - ingress
---
# MCP server embutido do Securo (ClusterIP 8765, criado pelo chart). So pela tailnet:
# o /mcp do dominio publico fica desligado (mcpServer.publicRoute false).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: securo-mcp
  namespace: securo
  annotations:
    tailscale.com/proxy-group: ingress
spec:
  ingressClassName: tailscale
  defaultBackend:
    service: {name: securo-mcp-server, port: {number: 8765}}
  tls:
    - hosts: [securo-mcp]
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroupPolicy
metadata:
  name: tailscale-ingress
  namespace: securo
spec:
  ingress:
    - ingress
