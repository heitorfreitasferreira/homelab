- name: Hostname
  ansible.builtin.hostname:
    name: "{{ casa_hostname }}"

- name: Hostname in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1\t{{ casa_hostname }}"

- name: Timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Packages
  ansible.builtin.apt:
    name:
      - sudo
      - podman
      - nftables
      - ethtool
      - tcpdump
      - curl
      - ca-certificates
      - jq
      - rsync
      - unattended-upgrades
      - apt-listchanges
      - systemd-zram-generator
      - thermald
      - smartmontools
    state: present
    update_cache: true
    cache_valid_time: 3600

# --- Acesso: so chave SSH, sem root, sem senha --------------------------------------------
- name: Admin SSH key
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ admin_ssh_pubkey }}"

- name: Passwordless sudo for admin (acesso so por SSH com chave, pela LAN ou pela tailnet)
  ansible.builtin.copy:
    dest: /etc/sudoers.d/90-{{ admin_user }}
    content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: visudo -cf %s

- name: SSH hardening
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-casa.conf
    content: |
      Port {{ ssh_port }}
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      AllowUsers {{ admin_user }}
      X11Forwarding no
    mode: "0644"
    validate: sshd -t -f %s
  notify: Restart ssh

# Aplica o sshd e o firewall antes das tarefas seguintes: um erro mais abaixo nao pode deixar
# a configuracao gravada em disco, mas nao em uso (handlers perdidos quando o play falha).
- name: Apply sshd config now
  ansible.builtin.meta: flush_handlers

# --- Rede: cabo no D-Link e firewall de entrada ----------------------------------------------
- name: Wired interface (DHCP; a reserva de IP fica no Huawei)
  ansible.builtin.copy:
    dest: /etc/network/interfaces.d/cabo
    content: |
      allow-hotplug {{ casa_lan_iface }}
      iface {{ casa_lan_iface }} inet dhcp
    mode: "0644"

- name: Kernel settings (subnet router, ARP with two interfaces, reboot after panic, zram)
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-casa.conf
  loop: "{{ sysctls | dict2items }}"
  vars:
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv6.conf.all.forwarding: 1
      net.ipv4.conf.all.arp_ignore: 1
      net.ipv4.conf.all.arp_announce: 2
      kernel.panic: 10
      # Console (tty1) so mostra erros graves do kernel, sem o ruido do driver Wi-Fi.
      kernel.printk: "3 4 1 3"
      vm.swappiness: "{{ casa_swappiness }}"

- name: nftables ruleset (table inet casa only, Tailscale and Podman keep their own tables)
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0644"
    validate: nft -c -f %s
  notify: Reload nftables

- name: nftables enabled
  ansible.builtin.service:
    name: nftables
    state: started
    enabled: true

- name: Apply firewall now
  ansible.builtin.meta: flush_handlers

- name: Tailscale as subnet router for the LAN (no Tailscale SSH, local DNS untouched)
  ansible.builtin.command: >-
    tailscale set --advertise-routes={{ casa_lan_cidr }} --ssh=false --accept-dns=false
  changed_when: false

# --- Servidor: tampa fechada, sem suspender, watchdog, disco, temperatura ------------------
- name: systemd drop-in directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/systemd/logind.conf.d
    - /etc/systemd/system.conf.d
    - /etc/systemd/journald.conf.d
    - /etc/systemd/network

- name: Lid closed and idle must not suspend
  ansible.builtin.copy:
    dest: /etc/systemd/logind.conf.d/servidor.conf
    content: |
      [Login]
      HandleLidSwitch=ignore
      HandleLidSwitchExternalPower=ignore
      HandleLidSwitchDocked=ignore
      IdleAction=ignore
    mode: "0644"
  notify: Restart logind

- name: Sleep targets masked
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
  loop: [sleep.target, suspend.target, hibernate.target, hybrid-sleep.target]

- name: GRUB must boot unattended (hidden menu, short timeout, also after a power cut)
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^#?{{ item.key }}='
    line: "{{ item.key }}={{ item.value }}"
  loop:
    - { key: GRUB_TIMEOUT_STYLE, value: hidden }
    - { key: GRUB_TIMEOUT, value: "2" }
    - { key: GRUB_RECORDFAIL_TIMEOUT, value: "2" }
  notify: Update grub

- name: Hardware watchdog (iTCO) resets the machine if systemd hangs
  ansible.builtin.copy:
    dest: /etc/systemd/system.conf.d/watchdog.conf
    content: |
      [Manager]
      RuntimeWatchdogSec=30
      RebootWatchdogSec=5min
    mode: "0644"
  notify: Reexec systemd

- name: Persistent journal with a size cap
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/casa.conf
    content: |
      [Journal]
      Storage=persistent
      SystemMaxUse=300M
    mode: "0644"
  notify: Restart journald

- name: zram swap
  ansible.builtin.copy:
    dest: /etc/systemd/zram-generator.conf
    content: |
      [zram0]
      zram-size = {{ casa_zram_size }}
      compression-algorithm = zstd
      swap-priority = 100
    mode: "0644"
  notify: Restart zram

- name: Security updates, reboot only when needed
  ansible.builtin.copy:
    dest: "/etc/apt/apt.conf.d/{{ item.name }}"
    content: "{{ item.content }}"
    mode: "0644"
  loop:
    - name: 20auto-upgrades
      content: |
        APT::Periodic::Update-Package-Lists "1";
        APT::Periodic::Unattended-Upgrade "1";
    - name: 52casa-unattended
      content: |
        Unattended-Upgrade::Automatic-Reboot "true";
        Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
        Unattended-Upgrade::Automatic-Reboot-Time "{{ casa_reboot_time }}";
        Unattended-Upgrade::Remove-Unused-Dependencies "true";

- name: Disk health and thermal services
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: [smartmontools, thermald]

# --- Containers (Quadlet) -----------------------------------------------------------------
- name: Container directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/containers/systemd, mode: "0755" }
    - { path: /var/lib/homeassistant, mode: "0755" }
    - { path: /var/lib/matterhub, mode: "0700" }

# Metricas do no para o VictoriaMetrics do racknerd, que coleta pela tailnet (100.112.62.47:9100).
# O nftables so aceita a 9100 vinda da LAN e do tailscale0.
- name: node-exporter
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present

- name: node-exporter running
  ansible.builtin.service:
    name: prometheus-node-exporter
    state: started
    enabled: true

# Timers do pacote Debian que escrevem metricas APT, SMART e NVMe no textfile collector.
- name: node-exporter textfile timers
  ansible.builtin.systemd_service:
    name: "prometheus-node-exporter-{{ item }}.timer"
    state: started
    enabled: true
  loop: [apt, smartmon, nvme]

# --- mDNS: o OAuth do Xiaomi Home volta para http://homeassistant.local:8123 -------------
- name: Avahi
  ansible.builtin.apt:
    name: [avahi-daemon, avahi-utils]
    state: present

- name: Avahi only on the LAN interface
  ansible.builtin.lineinfile:
    path: /etc/avahi/avahi-daemon.conf
    regexp: '^#?allow-interfaces='
    line: "allow-interfaces={{ casa_lan_iface }}"
    insertafter: '^\[server\]'
  notify: Restart avahi

- name: Avahi enabled
  ansible.builtin.service:
    name: avahi-daemon
    state: started
    enabled: true

# /etc/avahi/hosts falha com "Local name collision": o PTR do IP ja pertence a casa.local.
# avahi-publish -R publica so o registro A, sem o reverso.
- name: Publish homeassistant.local (unit)
  ansible.builtin.copy:
    dest: /etc/systemd/system/mdns-homeassistant.service
    content: |
      [Unit]
      Description=Publica homeassistant.local via mDNS
      After=avahi-daemon.service
      BindsTo=avahi-daemon.service

      [Service]
      ExecStart=/usr/bin/avahi-publish -a -R homeassistant.local {{ casa_lan_ip }}
      Restart=always
      RestartSec=5
      User=avahi

      [Install]
      WantedBy=avahi-daemon.service
    mode: "0644"
  notify: Restart mdns-homeassistant

- name: Publish homeassistant.local
  ansible.builtin.systemd_service:
    name: mdns-homeassistant.service
    state: started
    enabled: true
    daemon_reload: true

- name: Home Assistant quadlet
  ansible.builtin.template:
    src: homeassistant.container.j2
    dest: /etc/containers/systemd/homeassistant.container
    mode: "0644"
  notify: Restart homeassistant

# Dois proxies entregam o HA: o `tailscale serve` em https://casa.tail76c1c6.ts.net (127.0.0.1) e o
# Traefik da VPS em https://casa.htrlab.duckdns.org (pods 10.42.0.0/16, via IP tailnet do `casa`).
# O HA 2026.11 migra o bloco `http:` do YAML para .storage/http uma unica vez e depois ignora o
# YAML, entao o proxy e configurado no armazenamento, com o servico parado.
- name: Check the stored HTTP proxy settings
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import json, sys
        try:
            stable = json.load(open("/var/lib/homeassistant/.storage/http"))["data"]["stable"]
        except (OSError, KeyError):
            print("ausente")
            sys.exit(0)
        want = {"use_x_forwarded_for": True,
                "trusted_proxies": ["127.0.0.1/32", "::1/128", "10.42.0.0/16"],
                "ip_ban_enabled": True,
                "login_attempts_threshold": 5}
        print("ok" if all(stable.get(key) == value for key, value in want.items()) else "ajustar")
  register: ha_http_check
  changed_when: false

- name: Stop Home Assistant before editing its stored HTTP config
  ansible.builtin.systemd_service:
    name: homeassistant.service
    state: stopped
  when: ha_http_check.stdout != 'ok'

- name: Home Assistant trusts the Tailscale Serve and Traefik proxies
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import json
        path = "/var/lib/homeassistant/.storage/http"
        doc = json.load(open(path))
        doc["data"]["stable"].update(
            use_x_forwarded_for=True,
            trusted_proxies=["127.0.0.1/32", "::1/128", "10.42.0.0/16"],
            ip_ban_enabled=True,
            login_attempts_threshold=5,
        )
        with open(path, "w") as handle:
            json.dump(doc, handle, indent=2)
  when: ha_http_check.stdout != 'ok'

- name: Home Assistant running again
  ansible.builtin.systemd_service:
    name: homeassistant.service
    state: started
  when: ha_http_check.stdout != 'ok'

# Ponte Matter para a Alexa (DECISIONS.md, item 26). O token do HA fica em /etc/matter-hub.env,
# criado a mao com `auth/long_lived_access_token`, fora do repositorio.
- name: Matter Hub token present
  ansible.builtin.stat:
    path: /etc/matter-hub.env
  register: matterhub_env

- name: Matter Hub token must exist before the container
  ansible.builtin.assert:
    that:
      - matterhub_env.stat.exists
      - matterhub_env.stat.mode == '0600'
    fail_msg: "Crie /etc/matter-hub.env (0600) com HAMH_HOME_ASSISTANT_ACCESS_TOKEN=..."

- name: Matter Hub quadlet
  ansible.builtin.template:
    src: matterhub.container.j2
    dest: /etc/containers/systemd/matterhub.container
    mode: "0644"
  notify: Restart matterhub

- name: Containers running (quadlet units start from their own [Install])
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    daemon_reload: true
  loop: [homeassistant.service, matterhub.service]

# Nomes HTTPS da tailnet: https://casa.tail76c1c6.ts.net (HA) e :8443 (Matter Hub).
# O certificado e o DNS ficam por conta do Tailscale, e nada e exposto fora da tailnet.
- name: Tailscale Serve publications
  ansible.builtin.command: >-
    tailscale serve --bg --https={{ item.port }} http://127.0.0.1:{{ item.upstream }}
  loop:
    - { port: 443, upstream: 8123 }
    - { port: "{{ casa_matterhub_serve_port }}", upstream: "{{ casa_matterhub_http_port }}" }
  changed_when: false
