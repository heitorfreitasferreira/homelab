- name: Tailscale apt key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Tailscale apt repo
  ansible.builtin.apt_repository:
    repo: deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/debian trixie main
    filename: tailscale
    state: present

- name: Tailscale installed
  ansible.builtin.apt:
    name:
      - tailscale
      - jq
    state: present
    update_cache: true

- name: Tailscale status
  ansible.builtin.command: tailscale status --json
  register: ts_status
  changed_when: false
  failed_when: false

- name: Tailscale up (only when not logged in yet)
  ansible.builtin.command: >-
    tailscale up --authkey={{ tailscale_authkey }} --hostname={{ inventory_hostname }} --ssh=false
  no_log: true
  when: >-
    ts_status.rc != 0 or
    (ts_status.stdout | from_json).BackendState != 'Running'
  failed_when: tailscale_authkey | length == 0

# O servidor nao usa o DNS da tailnet: o Pi-hole da tailnet roda neste cluster, e o CoreDNS
# ficaria sem DNS sempre que o pod do Pi-hole reiniciasse. Nomes *.ts.net: platform/coredns.
- name: Tailscale without tailnet DNS
  ansible.builtin.command: tailscale set --accept-dns=false
  changed_when: false

# Metricas do Tailscale no formato Prometheus. O node-exporter le o arquivo pelo
# textfile collector: no casa, o pacote Debian ja usa /var/lib/prometheus/node-exporter.
- name: Tailscale metrics directory
  ansible.builtin.file:
    path: /var/lib/prometheus/node-exporter
    state: directory
    mode: "0755"

- name: Tailscale metrics script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../nixos/scripts/tailscale-prometheus"
    dest: /usr/local/sbin/tailscale-prometheus
    mode: "0755"

- name: Tailscale metrics service
  ansible.builtin.copy:
    src: tailscale-prometheus.service
    dest: /etc/systemd/system/tailscale-prometheus.service
    mode: "0644"

- name: Tailscale metrics timer
  ansible.builtin.copy:
    src: tailscale-prometheus.timer
    dest: /etc/systemd/system/tailscale-prometheus.timer
    mode: "0644"

- name: Tailscale metrics timer running
  ansible.builtin.systemd_service:
    name: tailscale-prometheus.timer
    state: started
    enabled: true
    daemon_reload: true

- name: Tailscale metrics now
  ansible.builtin.command: /usr/local/sbin/tailscale-prometheus
  changed_when: false
