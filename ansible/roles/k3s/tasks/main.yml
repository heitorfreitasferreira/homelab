- name: k3s config dir
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Tailscale IP (k8s API SAN)
  ansible.builtin.command: tailscale ip -4
  register: ts_ip
  changed_when: false
  failed_when: false
  when: tailscale_enabled | bool

- name: k3s config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  notify: Restart k3s

- name: k3s installed version
  ansible.builtin.command: k3s --version
  register: k3s_installed
  changed_when: false
  failed_when: false

- name: Install k3s
  ansible.builtin.shell: >-
    set -o pipefail &&
    curl -sfL https://get.k3s.io |
    INSTALL_K3S_VERSION={{ k3s_version }} INSTALL_K3S_EXEC=server sh -
  args:
    executable: /bin/bash
  when: k3s_version not in (k3s_installed.stdout | default(''))

- name: k3s running
  ansible.builtin.service:
    name: k3s
    state: started
    enabled: true

- name: Node ready
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=30s
  register: node_wait
  retries: 12
  delay: 10
  until: node_wait.rc == 0
  changed_when: false

- name: Fetch kubeconfig
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ lookup('env', 'HOME') }}/.kube/homelab-{{ inventory_hostname }}.yaml"
    flat: true

- name: Point local kubeconfig at the reachable address
  delegate_to: localhost
  become: false
  ansible.builtin.replace:
    path: "{{ lookup('env', 'HOME') }}/.kube/homelab-{{ inventory_hostname }}.yaml"
    regexp: "https://127.0.0.1:6443"
    replace: "https://{{ (ts_ip.stdout | default('', true)) or ansible_host }}:6443"
