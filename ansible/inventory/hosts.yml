# racknerd: producao. lab: VM libvirt local para testar o playbook antes (scripts/lab-vm.sh).
all:
  children:
    homelab:
      hosts:
        racknerd:
          ansible_host: 23.254.208.229
          public_ip: 23.254.208.229
    # casa: notebook em casa (Debian 13, Podman, sem k3s). Playbook proprio: casa.yml.
    # Fora da tailnet, na LAN de casa: -e ansible_host=casa.local (mDNS)
    servidor_casa:
      hosts:
        casa:
          ansible_host: casa
          ansible_user: home
    lab:
      hosts:
        lab-vm:
          ansible_host: "{{ lookup('env', 'LAB_VM_IP') | default('192.168.122.50', true) }}"
          public_ip: "{{ ansible_host }}"
          tailscale_enabled: false
