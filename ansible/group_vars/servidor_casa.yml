# Sobrescreve group_vars/all.yml para o notebook de casa.
admin_user: home

casa_hostname: casa
casa_lan_cidr: 192.168.100.0/24
casa_lan_ip: 192.168.100.207
casa_lan_iface: enp2s0f5

# zram como swap principal. RAM: 1,8 GB (2 GB fisicos, DVMT da BIOS no minimo).
casa_zram_size: ram / 2
casa_swappiness: 100

# Atualizacoes de seguranca reiniciam a maquina so se o kernel pedir, nesta hora.
casa_reboot_time: "04:30"

casa_ha_image: ghcr.io/home-assistant/home-assistant@sha256:1e25a28cb9ee48dbcd33b65cbdcf2919d01991fe11f71cdae0a09c9fc3017ebb
casa_ha_memory: 700m

# HACS, loja da comunidade, versao fixada. O release 2.0.5 pede HA 2026.10.2 ou mais novo.
casa_hacs_version: "2.0.5"

# Home Assistant Matter Hub, fork RiDDiX (o original t0bst4r parou em jan/2026), tag 2.0.60.
casa_matterhub_image: ghcr.io/riddix/home-assistant-matter-hub@sha256:6f869bb3ec0b53fef50a29a330a681b19d1590bb56db09d74c3bc2d8bc74a0c3
casa_matterhub_memory: 300m
casa_matterhub_http_port: 8482
casa_matterhub_serve_port: 8443
casa_matterhub_host: casa.tail76c1c6.ts.net
