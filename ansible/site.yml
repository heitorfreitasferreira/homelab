# First run on a fresh Debian install: -e ansible_user=root (root + key from the provider).
# Later runs: ansible_user defaults to admin_user with sudo.
- name: Homelab host
  hosts: all
  become: true
  vars:
    ansible_user: "{{ bootstrap_user | default(admin_user) }}"
  roles:
    - base
    - firewall
    - role: tailscale
      when: tailscale_enabled | bool
    - k3s
    - argocd
