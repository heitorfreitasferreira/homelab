# Publico: ouvir no celular fora de casa e o uso principal.
apiVersion: v1
kind: Service
metadata:
  name: audiobookshelf
spec:
  selector: {app: audiobookshelf}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: audiobookshelf
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  rules:
    - host: audio.htrlab.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: audiobookshelf, port: {number: 80}}
  tls:
    - hosts: [audio.htrlab.duckdns.org]
      secretName: audiobookshelf-tls
