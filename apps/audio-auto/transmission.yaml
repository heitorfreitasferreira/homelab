# Transmission: cliente torrent do ReadMeABook. A senha do RPC vem do Secret (SOPS).
# Seed e download em /downloads, que o ReadMeABook tambem monta.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: transmission-config
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-downloads
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 10Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transmission
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: transmission}
  template:
    metadata:
      labels: {app: transmission}
    spec:
      nodeSelector:
        kubernetes.io/hostname: racknerd
      containers:
        - name: transmission
          image: lscr.io/linuxserver/transmission@sha256:5baf08cd73a566699f35baad3c4a84ba7d7057220566c5fb29969bf2292dc2ff
          env:
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1000"}
            - {name: TZ, value: America/Sao_Paulo}
            # Sem senha: o RPC so e alcancado pela tailnet e pela rede do cluster.
            - {name: TRANSMISSION_DOWNLOAD_DIR, value: /downloads}
            - {name: TRANSMISSION_INCOMPLETE_DIR_ENABLED, value: "false"}
          ports:
            - {name: rpc, containerPort: 9091}
            - {name: peer, containerPort: 51413, protocol: TCP}
            - {name: peer-udp, containerPort: 51413, protocol: UDP}
          readinessProbe:
            tcpSocket: {port: rpc}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: rpc}
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: downloads, mountPath: /downloads}
            # A biblioteca do AudioBookshelf, para os torrents antigos continuarem semeando
            # e para os 5 livros importados ficarem no lugar certo.
            - {name: library, mountPath: /audiobooks}
      volumes:
        - name: config
          persistentVolumeClaim: {claimName: transmission-config}
        - name: downloads
          persistentVolumeClaim: {claimName: audiobookshelf-downloads}
        - name: library
          persistentVolumeClaim: {claimName: audiobookshelf-audiobooks}
---
apiVersion: v1
kind: Service
metadata:
  name: transmission
spec:
  selector: {app: transmission}
  ports:
    - {name: rpc, port: 9091, targetPort: rpc}
    - {name: peer, port: 51413, targetPort: peer}
