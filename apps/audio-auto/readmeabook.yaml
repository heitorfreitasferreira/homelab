# ReadMeABook: pedidos e automacao de audiobooks. Traz Postgres 16, Redis 7 e o app
# (Next.js) no mesmo container, por supervisord. O volume pgdata guarda o banco e o
# config guarda os segredos gerados no primeiro boot: os dois andam juntos no backup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: readmeabook-config
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: readmeabook-cache
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: readmeabook-pgdata
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: readmeabook-redis
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 256Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: readmeabook
spec:
  replicas: 1
  # Postgres e Redis rodam dentro do pod: dois pods no mesmo volume quebram o banco.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: readmeabook}
  template:
    metadata:
      labels: {app: readmeabook}
    spec:
      nodeSelector:
        kubernetes.io/hostname: racknerd
      terminationGracePeriodSeconds: 90
      initContainers:
        # O AudioBookshelf roda como root e o PVC nasce com dono do root. O RMAB
        # escreve como 1000 no diretorio da biblioteca.
        - name: library-permissions
          image: busybox:1.37
          command: ["sh", "-c", "chown 1000:1000 /media/audiobooks"]
          volumeMounts:
            - {name: library, mountPath: /media/audiobooks}
      containers:
        - name: readmeabook
          image: ghcr.io/kikootwo/readmeabook@sha256:3c4e18563b3e22c7b67bcf3b323e81fda840159ea6c71eee91ab13a2d49b0cf1
          env:
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1000"}
            - {name: TZ, value: America/Sao_Paulo}
            - {name: PUBLIC_URL, value: https://pedidos.htrlab.duckdns.org}
            - {name: LOG_LEVEL, value: info}
          ports:
            - {name: http, containerPort: 3030}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 60
            periodSeconds: 15
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 120
            periodSeconds: 30
          resources:
            requests: {cpu: 200m, memory: 384Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: config, mountPath: /app/config}
            - {name: cache, mountPath: /app/cache}
            - {name: pgdata, mountPath: /var/lib/postgresql/data}
            - {name: redis, mountPath: /var/lib/redis}
            - {name: downloads, mountPath: /downloads}
            # Mesmo PVC que o AudioBookshelf monta em /audiobooks.
            - {name: library, mountPath: /media/audiobooks}
      volumes:
        - name: config
          persistentVolumeClaim: {claimName: readmeabook-config}
        - name: cache
          persistentVolumeClaim: {claimName: readmeabook-cache}
        - name: pgdata
          persistentVolumeClaim: {claimName: readmeabook-pgdata}
        - name: redis
          persistentVolumeClaim: {claimName: readmeabook-redis}
        - name: downloads
          persistentVolumeClaim: {claimName: audiobookshelf-downloads}
        - name: library
          persistentVolumeClaim: {claimName: audiobookshelf-audiobooks}
---
apiVersion: v1
kind: Service
metadata:
  name: readmeabook
spec:
  selector: {app: readmeabook}
  ports:
    - {name: http, port: 3030, targetPort: http}
