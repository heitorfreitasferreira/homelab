# ReadMeABook e publico (pedidos do celular sem tailnet). Prowlarr e Transmission
# so pela tailnet, porque sao admin.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: readmeabook
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  rules:
    - host: pedidos.htrlab.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: readmeabook, port: {number: 3030}}
  tls:
    - hosts: [pedidos.htrlab.duckdns.org]
      secretName: readmeabook-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prowlarr
  annotations:
    tailscale.com/proxy-group: ingress
spec:
  ingressClassName: tailscale
  defaultBackend:
    service: {name: prowlarr, port: {number: 9696}}
  tls:
    - hosts: [prowlarr]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transmission
  annotations:
    tailscale.com/proxy-group: ingress
spec:
  ingressClassName: tailscale
  defaultBackend:
    service: {name: transmission, port: {number: 9091}}
  tls:
    - hosts: [transmission]
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroupPolicy
metadata:
  name: tailscale-ingress
spec:
  ingress:
    - ingress
