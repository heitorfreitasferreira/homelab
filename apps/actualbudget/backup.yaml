# Backup diario do /data (SQLite do Actual) para o R2.
# Copia inteira por dia, sem apagar nada antes de 31 dias.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: actualbudget-backup
  namespace: actualbudget
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: rclone
              image: rclone/rclone:1.75.2
              env:
                - {name: RCLONE_CONFIG_DST_TYPE, value: s3}
                - {name: RCLONE_CONFIG_DST_PROVIDER, value: Cloudflare}
                - {name: RCLONE_CONFIG_DST_REGION, value: auto}
                - {name: RCLONE_CONFIG_DST_ENDPOINT, value: "https://8ef031572e6694f614275029be68313a.r2.cloudflarestorage.com"}
                - name: RCLONE_CONFIG_DST_ACCESS_KEY_ID
                  valueFrom: {secretKeyRef: {name: r2-backups, key: ACCESS_KEY_ID}}
                - name: RCLONE_CONFIG_DST_SECRET_ACCESS_KEY
                  valueFrom: {secretKeyRef: {name: r2-backups, key: ACCESS_SECRET_KEY}}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  rclone copy /data "dst:htr-backups/actualbudget/snapshots/$(date +%F)" \
                    --checksum --stats 60s --stats-one-line --log-level INFO
                  rclone delete dst:htr-backups/actualbudget/snapshots --min-age 31d
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {memory: 256Mi}
              volumeMounts:
                - {name: data, mountPath: /data, readOnly: true}
          volumes:
            - name: data
              persistentVolumeClaim: {claimName: actualbudget-data, readOnly: true}