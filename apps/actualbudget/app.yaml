# Actual Budget 26.11 (imagem edge-alpine pinada por digest).
# Guarda tudo em SQLite no PVC /data. Nao usa Postgres.
# Credenciais do Pluggy sao gravadas pelo proprio Actual, pela interface,
# em Settings > Bank Sync. Nao vem de env.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: actualbudget-data
  namespace: actualbudget
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: actualbudget
  namespace: actualbudget
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: actualbudget}
  template:
    metadata:
      labels: {app: actualbudget}
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: actualbudget
          image: actualbudget/actual-server:edge-alpine@sha256:e7d429e8e6c95606e0b6c4c8e01d3fd5a08ea0f36964f0310210f6165510bbb1
          env:
            - {name: NODE_ENV, value: production}
            - {name: PORT, value: "5006"}
          ports: [{containerPort: 5006}]
          readinessProbe:
            httpGet: {path: /health, port: 5006}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 5006}
            initialDelaySeconds: 45
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: actualbudget-data}
---
apiVersion: v1
kind: Service
metadata:
  name: actualbudget
  namespace: actualbudget
spec:
  selector: {app: actualbudget}
  ports: [{port: 5006, targetPort: 5006}]
---
# Ingress publico so para o certificado Let's Encrypt (HTTP-01).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: actualbudget
  namespace: actualbudget
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  rules:
    - host: financas.htrlab.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: actualbudget, port: {number: 5006}}}
  tls:
    - hosts: [financas.htrlab.duckdns.org]
      secretName: actualbudget-tls
---
# Ingress Tailscale (MagicDNS) para acesso so na tailnet: financas.tail76c1c6.ts.net
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: actualbudget-tailscale
  namespace: actualbudget
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: actualbudget
      port:
        number: 5006
  tls:
    - hosts:
        - financas