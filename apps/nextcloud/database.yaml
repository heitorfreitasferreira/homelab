# Metadados do Nextcloud (pastas, compartilhamentos, usuarios, previews indexados).
# Os arquivos ficam no bucket R2 htr-nextcloud, em objetos urn:oid:<id>: sem este banco eles nao tem nome.
# CNPG cria o secret nextcloud-db-app (usuario "app", banco "app").
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nextcloud-db
  namespace: nextcloud
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  storage:
    size: 5Gi
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {memory: 512Mi}
  backup:
    retentionPolicy: 30d
    barmanObjectStore:
      destinationPath: s3://htr-backups/cnpg/nextcloud-db
      endpointURL: https://8ef031572e6694f614275029be68313a.r2.cloudflarestorage.com
      s3Credentials:
        accessKeyId: {name: r2-backups, key: ACCESS_KEY_ID}
        secretAccessKey: {name: r2-backups, key: ACCESS_SECRET_KEY}
      wal:
        compression: gzip
      data:
        compression: gzip
  postgresql:
    parameters:
      shared_buffers: 64MB
      max_connections: "50"
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: nextcloud-db-daily
  namespace: nextcloud
spec:
  schedule: "0 0 4 * * *"
  backupOwnerReference: self
  immediate: true
  cluster:
    name: nextcloud-db
