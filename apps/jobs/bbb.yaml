# Legacy crontab: "0 21 * * * ~/scripts/notificar_do_bbb.py" (America/Sao_Paulo). Sends to ntfy.sh.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: notificar-bbb
spec:
  schedule: "0 21 * * *"
  timeZone: America/Sao_Paulo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: bbb
              image: python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
              command: ["python", "/script/notificar_do_bbb.py"]
              workingDir: /tmp
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 128Mi}
              volumeMounts: [{name: script, mountPath: /script}]
          volumes:
            - name: script
              configMap: {name: bbb-script}
