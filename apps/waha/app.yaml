apiVersion: apps/v1
kind: Deployment
metadata:
  name: waha
spec:
  replicas: 1
  # A sessao fica em PVC local-path RWO: dois pods no rollout travariam.
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels: {app: waha}
  template:
    metadata:
      labels: {app: waha}
    spec:
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: waha
          image: devlikeapro/waha:gows@sha256:1f7faeb0227ad5edb5711f7058bfce807ea65e5f92234af0778e4db140f6eb46
          env:
            - {name: WHATSAPP_DEFAULT_ENGINE, value: GOWS}
            - {name: WAHA_APPS_ENABLED, value: "True"}
            - {name: WAHA_DASHBOARD_ENABLED, value: "true"}
            - {name: WAHA_DASHBOARD_USERNAME, value: admin}
            - {name: WHATSAPP_SWAGGER_ENABLED, value: "false"}
            - {name: WAHA_API_KEY_EXCLUDE_PATH, value: "health,ping"}
            - {name: TZ, value: America/Sao_Paulo}
            - name: WAHA_API_KEY
              valueFrom:
                secretKeyRef: {name: waha-secrets, key: WAHA_API_KEY}
            # O modulo de Apps exige a chave em texto puro para emitir as chaves dos apps.
            - name: WAHA_API_KEY_PLAIN
              valueFrom:
                secretKeyRef: {name: waha-secrets, key: WAHA_API_KEY}
            - name: WAHA_DASHBOARD_PASSWORD
              valueFrom:
                secretKeyRef: {name: waha-secrets, key: WAHA_DASHBOARD_PASSWORD}
          ports: [{containerPort: 3000}]
          # TCP: o /health passa pelo API key e devolveria 401 no probe.
          readinessProbe:
            tcpSocket: {port: 3000}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket: {port: 3000}
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests: {cpu: 200m, memory: 192Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: sessions, mountPath: /app/.sessions}
        # O WAHA usa Redis em 127.0.0.1:6379 para o core.
        - name: redis
          image: docker.io/library/redis:8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports: [{containerPort: 6379}]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - name: sessions
          persistentVolumeClaim: {claimName: waha-sessions}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: waha-sessions
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: waha
spec:
  selector: {app: waha}
  ports: [{port: 80, targetPort: 3000}]
---
# Tailnet only: https://waha.tail76c1c6.ts.net
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: waha
  annotations:
    tailscale.com/proxy-group: ingress
spec:
  ingressClassName: tailscale
  defaultBackend:
    service: {name: waha, port: {number: 80}}
  tls:
    - hosts: [waha]
