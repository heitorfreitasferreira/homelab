# Publico: e o login dos apps que ja sao publicos (Securo, Nextcloud, AudioBookshelf).
apiVersion: v1
kind: Service
metadata:
  name: pocket-id
spec:
  selector: {app: pocket-id}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pocket-id
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  rules:
    - host: auth.htrlab.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: pocket-id, port: {number: 80}}
  tls:
    - hosts: [auth.htrlab.duckdns.org]
      secretName: pocket-id-tls
