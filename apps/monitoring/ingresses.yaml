# Grafana e a interface do VictoriaMetrics so pela tailnet.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  annotations:
    tailscale.com/proxy-group: ingress
spec:
  ingressClassName: tailscale
  defaultBackend:
    service: {name: grafana, port: {number: 80}}
  tls:
    - hosts: [grafana]
---
# O Service do chart e headless (StatefulSet), e o operador do Tailscale nao encaminha para ele.
apiVersion: v1
kind: Service
metadata:
  name: vmui
spec:
  selector:
    app: server
    app.kubernetes.io/instance: monitoring-vmsingle
    app.kubernetes.io/name: victoria-metrics-single
  ports: [{name: http, port: 8428, targetPort: 8428}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vmui
  annotations:
    tailscale.com/proxy-group: ingress
spec:
  ingressClassName: tailscale
  defaultBackend:
    service: {name: vmui, port: {number: 8428}}
  tls:
    - hosts: [metricas]
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroupPolicy
metadata:
  name: tailscale-ingress
spec:
  ingress:
    - ingress
