apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ente
resources:
  - namespace.yaml
  - database.yaml
generators:
  - secret-generator.yaml
helmCharts:
  - name: ente-photos
    repo: https://l4gdev.github.io/helm-charts
    version: 0.2.0
    releaseName: ente
    namespace: ente
    valuesFile: values.yaml
    skipTests: true
