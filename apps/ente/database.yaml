# Metadata only (albums, users, file keys). Photos live encrypted in R2 bucket htr-ente.
# CNPG creates secret ente-db-app (user "app", database "app").
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ente-db
  namespace: ente
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  storage:
    size: 5Gi
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {memory: 512Mi}
  postgresql:
    parameters:
      shared_buffers: 64MB
      max_connections: "50"
