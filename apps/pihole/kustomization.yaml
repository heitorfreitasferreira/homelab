apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pihole
resources:
  - namespace.yaml
  - app.yaml
generators:
  - secret-generator.yaml
configMapGenerator:
  # pihole-updatelists reads this file (BLOCKLISTS_URL) every weekly run.
  - name: pihole-adlists
    files:
      - adlists.txt
