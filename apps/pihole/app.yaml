# DNS only for the tailnet: hostNetwork + bind to tailscale0. Nothing listens on the public IP
# (the legacy setup was an open resolver on 0.0.0.0:53). nftables also drops 53/8053 outside tailscale0.
# Clients: Tailscale admin > DNS > nameserver 100.104.129.86 (racknerd tailnet IP).
#
# Image: pihole/pihole + php + pihole-updatelists (https://github.com/jacklul/pihole-updatelists),
# pinned by digest like the upstream one it replaces (same base, same tag).
# The adlists live in gravity.db on the PVC, but their source of truth is adlists.txt: a weekly
# cron (Sat 03:25) adds/removes lists there and runs gravity. Lists not in the file stay untouched.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pihole-etc
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: pihole}
  template:
    metadata:
      labels: {app: pihole}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: pihole
          image: jacklul/pihole:2026.11.0@sha256:49b9b92527a1675752181a71f966e0f3aecee5b773e94ac2e461e43d8351a74f
          env:
            - {name: TZ, value: America/Sao_Paulo}
            - {name: FTLCONF_dns_listeningMode, value: BIND}
            - {name: FTLCONF_dns_interface, value: tailscale0}
            - {name: FTLCONF_dns_upstreams, value: "1.1.1.1;9.9.9.9"}
            - {name: FTLCONF_webserver_port, value: "8053"}
            # Query history kept for 30 days (the legacy DB had grown to 1 GB).
            - {name: FTLCONF_database_maxDBdays, value: "30"}
            - name: FTLCONF_webserver_api_password
              valueFrom: {secretKeyRef: {name: pihole-secrets, key: FTLCONF_webserver_api_password}}
            # pihole-updatelists: only entries with this comment are managed (added/disabled).
            - {name: BLOCKLISTS_URL, value: /etc/adlists/adlists.txt}
            - {name: COMMENT, value: Managed by pihole-updatelists}
            - {name: CRONTAB_STRING, value: "25 3 * * 6"}
          readinessProbe:
            tcpSocket: {port: 8053}
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            # php + gravity on top of FTL.
            limits: {memory: 384Mi}
          volumeMounts:
            - {name: etc, mountPath: /etc/pihole}
            - {name: adlists, mountPath: /etc/adlists, readOnly: true}
      volumes:
        - name: etc
          persistentVolumeClaim: {claimName: pihole-etc}
        - name: adlists
          configMap: {name: pihole-adlists}
