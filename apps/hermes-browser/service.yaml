# NodePort fixo: o Hermes roda no host da racknerd, fora do cluster, e precisa
# de um endereco estavel mesmo que o Service seja recriado. O NodePort so escuta
# nos nos da tailnet, nao na internet.
apiVersion: v1
kind: Service
metadata:
  name: chromium
  namespace: hermes
spec:
  type: NodePort
  selector:
    app: chromium
  ports:
    - name: cdp
      port: 9222
      targetPort: cdp
      nodePort: 30922
