# Perfil persistente do Chromium: cookies e logins sobrevivem a restart do pod.
# O PV fica no pc-heito-wsl (local-path), entao so existe quando o PC esta ligado.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chromium-profile
  namespace: hermes
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 4Gi
